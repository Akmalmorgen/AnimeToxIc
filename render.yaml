services:
  - type: web
    name: anime-music-bot
    runtime: docker
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_ID
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: TRACEMOE_TOKEN
        sync: false
      - key: SAUCENAO_KEY
        sync: false
